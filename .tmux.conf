# Standalone tmux config migrated off oh-my-tmux.
# tmux-sensible is loaded via TPM and user overrides live here directly.

##### Core behavior

unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB:extkeys,screen-256color:RGB,tmux-256color:RGB:extkeys"
set -g extended-keys on
set -g extended-keys-format csi-u

set -g history-limit 100000
set -g mouse on
set -g status-keys vi
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### Window and pane behavior

# Keep new panes/windows in the current working directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"

##### Quality-of-life bindings

# Remove stale bindings from previously loaded plugins in long-lived tmux servers.
unbind-key -T prefix Tab
unbind-key -T prefix Space
unbind-key -T prefix ?
unbind-key -T prefix F

bind-key -N "Reload tmux config" r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
bind-key -N "Toggle mouse mode" m if -F "#{mouse}" "set -g mouse off" "set -g mouse on" \; display-message "mouse #{?mouse,on,off}"
bind-key -N "Toggle marked pane" M if -F "#{pane_marked}" "select-pane -M" "select-pane -m" \; refresh-client -S
bind-key -N "Edit pane scrollback" C-e run-shell "~/.config/tmux/scripts/edit-scrollback.sh '#{pane_id}'"
bind-key -N "Open scratch terminal" C-s display-popup -E -h "80%" -w "80%" "tmux new-session -A -s 'Scratch-Terminal'"
bind-key -N "Open sesh picker" T run-shell "sesh connect \"$(sesh list --icons | fzf-tmux -p 80%,70% --no-sort --ansi --border-label ' sesh ' --prompt '> ' --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' --bind 'tab:down,btab:up' --bind 'ctrl-a:change-prompt(> )+reload(sesh list --icons)' --bind 'ctrl-t:change-prompt(tmux> )+reload(sesh list -t --icons)' --bind 'ctrl-g:change-prompt(configs> )+reload(sesh list -c --icons)' --bind 'ctrl-x:change-prompt(zoxide> )+reload(sesh list -z --icons)' --bind 'ctrl-f:change-prompt(find> )+reload(fd -H -d 2 -t d -E .Trash . ~)' --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(> )+reload(sesh list --icons)' --preview-window 'right:55%' --preview 'sesh preview {}')\""
bind-key -N "Show prefix key help" ? display-popup -E -w "90%" -h "85%" "tmux list-keys -T prefix -N | less"

# Open context menus on button release so they remain open for mouse or keyboard selection.
unbind-key -T root MouseDown3Pane
unbind-key -T root MouseDown3Status
unbind-key -T root MouseDown3StatusLeft
bind-key -T root MouseUp3Pane select-pane -t = \; display-menu -T "#[align=centre]Pane #P: #T" -t = -x M -y M \
  "Rename Pane" n { command-prompt -p "Pane title:" -I "#T" { select-pane -T "%%" } } \
  '' \
  "Horizontal Split" h { split-window -h -c "#{pane_current_path}" } \
  "Vertical Split" v { split-window -v -c "#{pane_current_path}" } \
  "#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } \
  '' \
  "Swap Up" u { swap-pane -U } \
  "Swap Down" d { swap-pane -D } \
  "Kill Pane" X { kill-pane }
bind-key -T root MouseUp3Status select-window -t = \; display-menu -T "#[align=centre]Window #I: #W" -t = -x W -y W \
  "Rename Window" n { command-prompt -I "#W" { rename-window "%%" } } \
  "New After" w { new-window -a } \
  "New At End" W { new-window } \
  '' \
  "Swap Left" l { swap-window -t :-1 } \
  "Swap Right" r { swap-window -t :+1 } \
  "Kill Window" X { kill-window }
bind-key -T root MouseUp3StatusLeft display-menu -T "#[align=centre]Session #S" -x M -y W \
  "Next Session" n { switch-client -n } \
  "Previous Session" p { switch-client -p } \
  "Rename Session" r { command-prompt -I "#S" { rename-session "%%" } } \
  '' \
  "New Session" s { new-session } \
  "New Window" w { new-window } \
  "Detach" d { detach-client }

##### Status line

set -g status-style fg="#bcbcbc",bg="#1f2329"
set -g status-position top
set -g status-interval 5
set -g message-style fg="#bcbcbc",bg="#1f2329"
set -g message-command-style fg="#111111",bg="#f4d35e",bold
set -g message-format "#{?command_prompt,#[fill=#f4d35e]#[#{E:message-command-style}]#{message},#[fg=#111111#,bg=#f4d35e#,bold] #{message} #[fg=#f4d35e#,bg=#1f2329#,nobold]}"
set -g mode-style fg="#111111",bg="#f4d35e",bold
set -g pane-border-style fg="#4c566a"
set -g pane-active-border-style fg="#88c0d0"
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#88c0d0]#[bold],#[fg=#7b8794]}#P #T #[nobold]· #{pane_current_command} · #{b:pane_current_path} "
set -g pane-border-lines single
set -g status-left-length 24
set -g status-right-length 120
set -g status-left "#[fg=#111111,bg=#88c0d0,bold] 󰆍 #S #[fg=#88c0d0,bg=#1f2329,nobold]"
set -g status-right "#{?client_prefix,#[fg=#111111#,bg=#f4d35e#,bold] 󰌆 PREFIX #[default],}#{?pane_in_mode,#[fg=#111111#,bg=#b48ead#,bold] 󰆏 COPY #[default],}#{?pane_marked_set,#[fg=#111111#,bg=#d08770#,bold] 󰓾 MARK #[default],}#{?pane_synchronized,#[fg=#111111#,bg=#bf616a#,bold] 󰑓 SYNC #[default],}#{?mouse,#[fg=#8fbcbb] 󰍽 ,}#{?#{||:#{client_prefix},#{||:#{pane_in_mode},#{||:#{pane_marked_set},#{||:#{pane_synchronized},#{mouse}}}}},#[fg=#5e81ac]│ ,}#[fg=#a3be8c] #[fg=#d8dee9]%Y-%m-%d %H:%M #[fg=#5e81ac]│ #[fg=#a3be8c]󰖟 #[fg=#d8dee9]#(LC_ALL=C TZ=UTC date +'%%H:%%M') UTC #[fg=#5e81ac]│ #[fg=#eceff4]#H "
set -g window-status-separator " "
set -g window-status-format "#[fg=#252a31,bg=#1f2329]#[fg=#7b8794,bg=#252a31] 󰄱 #I:#W#{?window_zoomed_flag, 󰊓,} #[fg=#252a31,bg=#1f2329]"
set -g window-status-current-format "#[fg=#f4d35e,bg=#1f2329,nobold]#[fg=#111111,bg=#f4d35e,bold] 󰄲 #I:#W#{?window_zoomed_flag, 󰊓,} #[fg=#f4d35e,bg=#1f2329,nobold]"

##### Plugins

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'eduwass/tmux-palette'
set -g @palette-key 'C-p'             # optional, default: C-Space (no-prefix)
set -g @palette-find-pane-key 'M-f'       # optional, no binding by default
set -g @palette-move-pane-key 'M-m'       # optional, no binding by default

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'C-r'
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum hooks through status-right, so keep it last.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# TPM must stay at the bottom.
run '~/.config/tmux/plugins/tpm/tpm'

# Re-apply explicit user preferences after tmux-sensible initializes.
set -g status-keys vi
set -g mode-keys vi
