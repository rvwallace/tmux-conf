# Standalone tmux entry point migrated off oh-my-tmux.
# Visual settings live in themes/; behavior, bindings, and plugins live here.

##### Core behavior

unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix

set -g history-limit 100000
set -g mouse on
set -g detach-on-destroy off
set -g status-keys vi
set -g mode-keys vi

##### Terminal capabilities

set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB:extkeys,screen-256color:RGB,tmux-256color:RGB:extkeys"
set -g extended-keys on
set -g extended-keys-format csi-u

# Let terminal graphics protocols reach the outer terminal (for example, Yazi
# previews in Ghostty or Kitty) and preserve terminal detection on attach.
set -g allow-passthrough on
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WAYLAND_DISPLAY WINDOWID XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE TERM TERM_PROGRAM"

##### Window and pane defaults

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep new panes/windows in the current working directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"

##### Direct key bindings

# Remove stale bindings from previously loaded plugins in long-lived tmux servers.
unbind-key -T prefix Tab
unbind-key -T prefix Space
unbind-key -T prefix ?
unbind-key -T prefix F

bind-key -N "Open leader key menu" Space display-popup -E -d "#{pane_current_path}" -w "68%" -h "65%" "~/.config/tmux/scripts/tmux-menu.py"
bind-key -N "Open command palette" -n C-p display-popup -E -d "#{pane_current_path}" -w "68%" -h "65%" "~/.config/tmux/scripts/tmux-menu.py --search"
bind-key -N "Open command palette" P display-popup -E -d "#{pane_current_path}" -w "68%" -h "65%" "~/.config/tmux/scripts/tmux-menu.py --search"
bind-key -N "Reload tmux config" r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
bind-key -N "Toggle mouse mode" m if -F "#{mouse}" "set -g mouse off" "set -g mouse on" \; display-message "mouse #{?mouse,on,off}"
bind-key -N "Toggle marked pane" M if -F "#{pane_marked}" "select-pane -M" "select-pane -m" \; refresh-client -S
bind-key -N "Edit pane scrollback" C-e run-shell "~/.config/tmux/scripts/edit-scrollback.sh '#{pane_id}'"
bind-key -N "Insert file paths" C-f display-popup -E -d "#{pane_current_path}" -w "80%" -h "80%" "~/.config/tmux/scripts/tmux-file-picker"
bind-key -N "Open Snaglord command-output browser" C-y display-popup -E -w "70%" -h "75%" "tmux-snaglord"
bind-key -N "Open scratch terminal" C-s display-popup -E -h "80%" -w "80%" "tmux new-session -A -s 'Scratch-Terminal'"
bind-key -N "Open sesh picker" T run-shell "sesh connect \"$(sesh list --icons | fzf-tmux -p 80%,70% --no-sort --ansi --border-label ' sesh ' --prompt '> ' --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' --bind 'tab:down,btab:up' --bind 'ctrl-a:change-prompt(> )+reload(sesh list --icons)' --bind 'ctrl-t:change-prompt(tmux> )+reload(sesh list -t --icons)' --bind 'ctrl-g:change-prompt(configs> )+reload(sesh list -c --icons)' --bind 'ctrl-x:change-prompt(zoxide> )+reload(sesh list -z --icons)' --bind 'ctrl-f:change-prompt(find> )+reload(fd -H -d 2 -t d -E .Trash . ~)' --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(> )+reload(sesh list --icons)' --preview-window 'right:55%' --preview 'sesh preview {}')\""
bind-key -N "Show prefix key help" ? display-popup -E -w "80%" -h "75%" "~/.config/tmux/scripts/tmux-prefix-help.py"

##### Mouse context menus

# Open context menus on button release so they remain open for mouse or keyboard selection.
unbind-key -T root MouseDown3Pane
unbind-key -T root MouseDown3Status
unbind-key -T root MouseDown3StatusLeft
bind-key -T root MouseUp3Pane select-pane -t = \; display-menu -O -T "#[align=centre]Pane #P: #T" -t = -x M -y M \
  "Rename Pane" n { command-prompt -p "Pane title:" -I "#T" { select-pane -T "%%" } } \
  '' \
  "Horizontal Split" h { split-window -h -c "#{pane_current_path}" } \
  "Vertical Split" v { split-window -v -c "#{pane_current_path}" } \
  "#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } \
  '' \
  "Swap Up" u { swap-pane -U } \
  "Swap Down" d { swap-pane -D } \
  "Kill Pane" X { kill-pane }
bind-key -T root MouseUp3Status select-window -t = \; display-menu -O -T "#[align=centre]Window #I: #W" -t = -x W -y W \
  "Rename Window" n { command-prompt -I "#W" { rename-window "%%" } } \
  "New After" w { new-window -a } \
  "New At End" W { new-window } \
  '' \
  "Swap Left" l { swap-window -t :-1 } \
  "Swap Right" r { swap-window -t :+1 } \
  "Kill Window" X { kill-window }
bind-key -T root MouseUp3StatusLeft display-menu -O -T "#[align=centre]Session #S" -x M -y W \
  "Next Session" n { switch-client -n } \
  "Previous Session" p { switch-client -p } \
  "Rename Session" r { command-prompt -I "#S" { rename-session "%%" } } \
  '' \
  "New Session" s { new-session } \
  "New Window" w { new-window } \
  "Detach" d { detach-client }

##### Theme

source-file "$HOME/.config/tmux/themes/tokyo-night.conf"

##### Plugins

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# Core behavior and workflow plugins. Preserve declaration order.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'laktak/extrakto'

# Fuzzy link opening.
set -g @plugin 'alberti42/tmux-fzf-links'
set-option -g @fzf-links-editor-open-cmd "tmux new-window -n 'nvim' /opt/homebrew/bin/nvim +%line '%file'"

# Session persistence.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'C-r'
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum hooks through status-right, so keep it last.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# TPM must stay at the bottom.
run '~/.config/tmux/plugins/tpm/tpm'

##### Post-plugin overrides

# Re-apply explicit user preferences after tmux-sensible initializes.
set -g status-keys vi
set -g mode-keys vi
