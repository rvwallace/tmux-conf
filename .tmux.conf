# Standalone tmux config migrated off oh-my-tmux.
# tmux-sensible is loaded via TPM and user overrides live here directly.

##### Core behavior

unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB:extkeys,screen-256color:RGB,tmux-256color:RGB:extkeys"
set -g extended-keys on

set -g history-limit 100000
set -g mouse on
set -g status-keys vi
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### Window and pane behavior

# Keep new panes/windows in the current working directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

##### Quality-of-life bindings

# Remove stale bindings from previously loaded plugins in long-lived tmux servers.
unbind-key -T prefix Tab
unbind-key -T prefix Space
unbind-key -T prefix ?
unbind-key -T prefix F

bind-key r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
bind-key m if -F "#{mouse}" "set -g mouse off" "set -g mouse on" \; display-message "mouse #{?mouse,on,off}"
bind-key C-e run-shell "~/.config/tmux/scripts/edit-scrollback.sh '#{pane_id}'"
bind-key C-s display-popup -E -h "80%" -w "80%" "tmux new-session -A -s 'Scratch-Terminal'"
bind-key T run-shell "sesh connect \"$(sesh list --icons | fzf-tmux -p 80%,70% --no-sort --ansi --border-label ' sesh ' --prompt '> ' --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' --bind 'tab:down,btab:up' --bind 'ctrl-a:change-prompt(> )+reload(sesh list --icons)' --bind 'ctrl-t:change-prompt(tmux> )+reload(sesh list -t --icons)' --bind 'ctrl-g:change-prompt(configs> )+reload(sesh list -c --icons)' --bind 'ctrl-x:change-prompt(zoxide> )+reload(sesh list -z --icons)' --bind 'ctrl-f:change-prompt(find> )+reload(fd -H -d 2 -t d -E .Trash . ~)' --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(> )+reload(sesh list --icons)' --preview-window 'right:55%' --preview 'sesh preview {}')\""

##### Status line

set -g status-style fg="#bcbcbc",bg="#1f2329"
set -g status-position top
set -g message-style fg="#111111",bg="#f4d35e",bold
set -g mode-style fg="#111111",bg="#f4d35e",bold
set -g pane-border-style fg="#4c566a"
set -g pane-active-border-style fg="#88c0d0"
set -g status-left-length 24
set -g status-right-length 72
set -g status-left "#[fg=#111111,bg=#88c0d0,bold] #S #[fg=#88c0d0,bg=#1f2329,nobold]"
set -g status-right "#{?client_prefix,#[fg=#111111,bg=#f4d35e,bold] PREFIX #[fg=#f4d35e,bg=#1f2329],}#{?mouse,#[fg=#8fbcbb,bg=#1f2329] mouse ,}#{?pane_synchronized,#[fg=#bf616a,bg=#1f2329,bold] sync ,}#[fg=#d8dee9,bg=#1f2329]local #(LC_ALL=C date +'%%Y-%%m-%%d %%H:%%M') #[fg=#5e81ac,bg=#1f2329]| #[fg=#a3be8c,bg=#1f2329]UTC #(LC_ALL=C TZ=UTC date +'%%Y-%%m-%%d %%H:%%M') #[fg=#5e81ac,bg=#1f2329]| #[fg=#eceff4,bg=#1f2329]#H "
set -g window-status-separator " "
set -g window-status-format "#[fg=#7b8794,bg=#252a31] #I:#W#{?window_zoomed_flag, Z,} "
set -g window-status-current-format "#[fg=#111111,bg=#f4d35e,bold] #I:#W#{?window_zoomed_flag, Z,} "

##### Plugins

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'eduwass/tmux-palette'
set -g @palette-key 'C-p'             # optional, default: C-Space (no-prefix)
set -g @palette-find-pane-key 'M-f'       # optional, no binding by default
set -g @palette-move-pane-key 'M-m'       # optional, no binding by default

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'C-r'
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum hooks through status-right, so keep it last.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# TPM must stay at the bottom.
run '~/.config/tmux/plugins/tpm/tpm'

# Re-apply explicit user preferences after tmux-sensible initializes.
set -g status-keys vi
set -g mode-keys vi
