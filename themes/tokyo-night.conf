# Tokyo Night Storm visual system for tmux.

set -g status-style fg="#c0caf5",bg="#1a1b26"
set -g status-position top
set -g status-interval 5

set -g message-style fg="#c0caf5",bg="#1a1b26"
set -g message-command-style fg="#1a1b26",bg="#e0af68",bold
set -g message-format "#{?command_prompt,#[fill=#e0af68]#[#{E:message-command-style}]#{message},#[fg=#1a1b26#,bg=#e0af68#,bold] #{message} #[fg=#e0af68#,bg=#1a1b26#,nobold]}"
set -g mode-style fg="#1a1b26",bg="#bb9af7",bold

set -g pane-border-style fg="#3b4261"
set -g pane-active-border-style fg="#7dcfff"
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#7dcfff]#[bold],#[fg=#565f89]}#P #T #[nobold]· #{pane_current_command} · #{b:pane_current_path} "
set -g pane-border-lines single

set -g status-left-length 24
set -g status-right-length 120
set -g status-left "#[fg=#1a1b26,bg=#bb9af7,bold] 󰆍 #S #[fg=#bb9af7,bg=#1a1b26,nobold]"
set -g status-right "#{?client_prefix,#[fg=#e0af68]#[fg=#1a1b26#,bg=#e0af68#,bold] 󰌆 PREFIX #[fg=#e0af68#,bg=#1a1b26#,nobold] ,}#{?pane_in_mode,#[fg=#bb9af7]#[fg=#1a1b26#,bg=#bb9af7#,bold] 󰆏 COPY #[fg=#bb9af7#,bg=#1a1b26#,nobold] ,}#{?pane_marked_set,#[fg=#ff9e64]#[fg=#1a1b26#,bg=#ff9e64#,bold] 󰓾 MARK #[fg=#ff9e64#,bg=#1a1b26#,nobold] ,}#{?pane_synchronized,#[fg=#f7768e]#[fg=#1a1b26#,bg=#f7768e#,bold] 󰑓 SYNC #[fg=#f7768e#,bg=#1a1b26#,nobold] ,}#{?mouse,#[fg=#7dcfff] 󰍽 ,}#{?#{||:#{client_prefix},#{||:#{pane_in_mode},#{||:#{pane_marked_set},#{||:#{pane_synchronized},#{mouse}}}}},#[fg=#565f89]│ ,}#[fg=#9ece6a] #[fg=#c0caf5]%Y-%m-%d %H:%M #[fg=#565f89]│ #[fg=#9ece6a]󰖟 #[fg=#c0caf5]#(LC_ALL=C TZ=UTC date +'%%H:%%M') UTC #[fg=#565f89]│ #[fg=#7dcfff]󰂋 #[fg=#c0caf5]#H "
set -g window-status-separator " "
set -g window-status-format "#[fg=#24283b,bg=#1a1b26]#[fg=#565f89,bg=#24283b] 󰄱 #I:#W#{?window_zoomed_flag, 󰊓,} #[fg=#24283b,bg=#1a1b26]"
set -g window-status-current-format "#[fg=#7aa2f7,bg=#1a1b26,nobold]#[fg=#1a1b26,bg=#7aa2f7,bold] 󰄲 #I:#W#{?window_zoomed_flag, 󰊓,} #[fg=#7aa2f7,bg=#1a1b26,nobold]"

# Match the supported which-key popup surface to the tmux theme.
set -g @which-key-popup-bg '#1a1b26'
set -g @which-key-popup-fg '#565f89'
